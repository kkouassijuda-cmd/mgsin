{% if page.has_other_pages %}
  <nav class="pagination" aria-label="Pages">
    {% if page.has_previous %}
      <a class="pagination__lien" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">← Précédente</a>
    {% endif %}
    <span class="pagination__info">Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a class="pagination__lien" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Suivante →</a>
    {% endif %}
  </nav>
{% endif %}
